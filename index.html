<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuis Peralatan Sekolah</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --fg: #1d1d1b;
  --muted: #6b6a64;
  --line: #e2e0d8;
  --accent: #1f6b5c;
  --accent-fg: #ffffff;
  --good: #1f7a3d;
  --good-bg: #e3f3e8;
  --bad: #a3322a;
  --bad-bg: #f8e4e1;
  --font-ar: "Noto Naskh Arabic", "Traditional Arabic", serif;
  --font-body: "Inter", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161715;
    --surface: #1f201d;
    --fg: #ecebe6;
    --muted: #9c9b93;
    --line: #34352f;
    --accent: #6fc2ad;
    --accent-fg: #0f1412;
    --good: #7fd49a;
    --good-bg: #1d3327;
    --bad: #f0a097;
    --bad-bg: #3a201d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161715;
  --surface: #1f201d;
  --fg: #ecebe6;
  --muted: #9c9b93;
  --line: #34352f;
  --accent: #6fc2ad;
  --accent-fg: #0f1412;
  --good: #7fd49a;
  --good-bg: #1d3327;
  --bad: #f0a097;
  --bad-bg: #3a201d;
  color-scheme: dark;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
main { max-width: 640px; margin: 0 auto; }
header { margin-bottom: 20px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
.ar-title {
  font-family: var(--font-ar);
  font-size: 1.6rem;
  color: var(--accent);
  margin: 0;
  direction: rtl;
  text-align: right;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  min-width: 0;
}
.qno {
  font-size: 0.8rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 8px;
}
.qimg {
  display: flex;
  justify-content: center;
  color: var(--accent);
  margin: 0 0 14px;
}
.qimg svg { width: 120px; max-width: 100%; height: auto; }
.qtext {
  font-family: var(--font-ar);
  font-size: 1.35rem;
  direction: rtl;
  text-align: right;
  margin: 0 0 14px;
  line-height: 1.8;
}
.word { font-family: var(--font-ar); font-weight: 700; }

.opts { display: grid; gap: 8px; }
.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  font: inherit;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  cursor: pointer;
  min-width: 0;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.letter {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 0.85rem;
  font-weight: 600;
}
.opt-text {
  font-family: var(--font-ar);
  font-size: 1.15rem;
  direction: rtl;
  overflow-wrap: anywhere;
}
.opt.correct { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }

.feedback { min-height: 1.5em; margin: 12px 0 0; font-weight: 600; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }

.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; }
button.primary, button.ghost {
  font: inherit;
  font-weight: 600;
  border-radius: 8px;
  padding: 10px 16px;
  cursor: pointer;
  border: 1px solid var(--accent);
}
button.primary { background: var(--accent); color: var(--accent-fg); }
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.progress {
  height: 6px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 16px;
}
.progress > span { display: block; height: 100%; background: var(--accent); width: 0; }

.result h2 { margin: 0 0 6px; font-size: 1.3rem; }
.score { font-size: 2.4rem; font-weight: 600; margin: 0; color: var(--accent); }
.result p { margin: 8px 0 16px; }

@media (prefers-reduced-motion: no-preference) {
  .progress > span { transition: width 0.3s ease; }
}
</style>

<main>
  <header>
    <p class="ar-title">الأَدَوَات المَدْرَسِيَّة</p>
    <h1>Kuis Peralatan Sekolah</h1>
    <p class="sub">10 soal pilihan ganda. Pilih satu jawaban untuk melihat hasilnya.</p>
  </header>

  <div class="progress" aria-hidden="true"><span id="bar"></span></div>

  <section class="card" id="quiz" aria-live="polite">
    <p class="qno" id="qno"></p>
    <div class="qimg" id="qimg"></div>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts" role="group" aria-label="Pilihan jawaban"></div>
    <p class="feedback" id="feedback"></p>
    <div class="nav">
      <button class="ghost" id="prev" type="button">Sebelumnya</button>
      <button class="primary" id="next" type="button" disabled>Berikutnya</button>
    </div>
  </section>

  <section class="card result" id="result" hidden>
    <h2>Selesai</h2>
    <p class="score" id="score"></p>
    <p id="summary"></p>
    <button class="primary" id="restart" type="button">Ulangi kuis</button>
  </section>
</main>

<script>
// Gambar dibuat dari SVG sederhana (tanpa unduhan), jadi tampil tanpa internet.
const SVG = (body) =>
  `<svg viewBox="0 0 120 120" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;

const ICONS = {
  buku: SVG(`
    <rect x="28" y="20" width="64" height="82" rx="4"/>
    <line x1="40" y1="20" x2="40" y2="102"/>
    <line x1="50" y1="42" x2="82" y2="42" stroke-width="3"/>
    <line x1="50" y1="56" x2="82" y2="56" stroke-width="3"/>
    <line x1="50" y1="70" x2="74" y2="70" stroke-width="3"/>`),
  pulpen: SVG(`
    <g transform="rotate(45 60 60)">
      <rect x="52" y="10" width="16" height="72" rx="3"/>
      <polygon points="52,82 68,82 60,104"/>
      <line x1="52" y1="22" x2="68" y2="22" stroke-width="3"/>
    </g>`),
  pensil: SVG(`
    <g transform="rotate(45 60 60)">
      <rect x="52" y="10" width="16" height="72"/>
      <line x1="52" y1="20" x2="68" y2="20"/>
      <polygon points="52,82 68,82 60,104"/>
      <polygon points="57,94 63,94 60,102" fill="currentColor"/>
    </g>`),
  penghapus: SVG(`
    <g transform="rotate(-20 60 60)">
      <rect x="30" y="42" width="60" height="36" rx="5"/>
      <line x1="60" y1="42" x2="60" y2="78" stroke-width="3"/>
    </g>`),
  penggaris: SVG(`
    <rect x="10" y="48" width="100" height="22" rx="2"/>
    <line x1="20" y1="48" x2="20" y2="56" stroke-width="3"/>
    <line x1="30" y1="48" x2="30" y2="54" stroke-width="3"/>
    <line x1="40" y1="48" x2="40" y2="56" stroke-width="3"/>
    <line x1="50" y1="48" x2="50" y2="54" stroke-width="3"/>
    <line x1="60" y1="48" x2="60" y2="56" stroke-width="3"/>
    <line x1="70" y1="48" x2="70" y2="54" stroke-width="3"/>
    <line x1="80" y1="48" x2="80" y2="56" stroke-width="3"/>
    <line x1="90" y1="48" x2="90" y2="54" stroke-width="3"/>
    <line x1="100" y1="48" x2="100" y2="56" stroke-width="3"/>`),
  tas: SVG(`
    <path d="M42 46 V34 Q42 22 60 22 Q78 22 78 34 V46"/>
    <rect x="26" y="46" width="68" height="60" rx="12"/>
    <rect x="40" y="70" width="40" height="26" rx="5" stroke-width="3"/>`),
  bukuTulis: SVG(`
    <rect x="32" y="18" width="56" height="84" rx="4"/>
    <circle cx="32" cy="30" r="3" fill="currentColor"/>
    <circle cx="32" cy="50" r="3" fill="currentColor"/>
    <circle cx="32" cy="70" r="3" fill="currentColor"/>
    <circle cx="32" cy="90" r="3" fill="currentColor"/>
    <line x1="44" y1="44" x2="78" y2="44" stroke-width="2.5"/>
    <line x1="44" y1="58" x2="78" y2="58" stroke-width="2.5"/>
    <line x1="44" y1="72" x2="78" y2="72" stroke-width="2.5"/>`),
  gunting: SVG(`
    <circle cx="40" cy="84" r="12"/>
    <circle cx="80" cy="84" r="12"/>
    <line x1="48" y1="76" x2="88" y2="16"/>
    <line x1="72" y1="76" x2="32" y2="16"/>`),
  papanTulis: SVG(`
    <rect x="14" y="20" width="92" height="64" rx="4"/>
    <path d="M30 40 H60 M30 52 H80" stroke-width="3"/>
    <line x1="30" y1="84" x2="90" y2="84" stroke-width="5"/>
    <line x1="36" y1="84" x2="30" y2="104"/>
    <line x1="84" y1="84" x2="90" y2="104"/>`),
  rautan: SVG(`
    <rect x="28" y="40" width="64" height="40" rx="6"/>
    <circle cx="60" cy="60" r="14" stroke-width="3"/>
    <polygon points="56,52 64,52 60,66" fill="currentColor"/>`),
};

// Jawaban pilihan sekarang dalam bahasa Arab. Kunci jawaban (answer) tidak berubah.
const QUESTIONS = [
  { q: "Benda ini biasa dibawa setiap hari ke sekolah dan berisi halaman-halaman tulisan. Apa nama benda ini dalam bahasa Arab?", word: "كِتَاب", icon: ICONS.buku, options: ["قَلَم رَصَاص", "كِتَاب", "مِمْحَاة", "حَقِيبَة"], answer: 1 },
  { q: "benda adalah alat tulis yang berisi tinta dan sering dipakai untuk menulis. Apa arti gambar tersebut dalam bahasa Arab?", word: "قَلَم", icon: ICONS.pulpen, options: ["مِسْطَرَة", "كِتَاب", "قَلَم رَصَاص", "قَلَم حِبْر"], answer: 3 },
  { q: "Saat salah menulis, kamu perlu benda untuk menghapus tulisan pensil. Apa arti dalam bahasa arabnya?", word: "مِمْحَاة", icon: ICONS.penghapus, options: ["مِمْحَاة", "مِسْطَرَة", "مِبْرَاة", "وَرَقَة"], answer: 0 },
  { q: "Untuk membuat garis lurus di buku, kamu bisa memakai . Apa arti kata tersebut dalam bahasa arab?", word: "مِسْطَرَة", icon: ICONS.penggaris, options: ["مِقَص", "مِسْطَرَة", "صَمْغ", "حَقِيبَة"], answer: 1 },
  { q: "Setiap pagi kamu membawa buku dan alat tulis ke sekolah menggunakan. Apa arti gambar tersebut dalam bahasa arab?", word: "حَقِيبَة", icon: ICONS.tas, options: ["طَاوِلَة", "كُرْسِيّ", "حَقِيبَة", "سَبُّورَة"], answer: 2 },
  { q: "Untuk mencatat pelajaran di kelas, kamu biasanya membawa. Apa arti gambar tersebut dalam bahasa arab?", word: "دَفْتَر", icon: ICONS.bukuTulis, options: ["دَفْتَر", "قَلَم رَصَاص", "قَلَم تَحْدِيد", "سَاعَة"], answer: 0 },
  { q: "Kertas atau kain yang ingin kamu potong bisa dipotong dengan. Apa arti gambar tersebut dalam bahasa arab?", word: "مِقَص", icon: ICONS.gunting, options: ["مِقَص", "صَمْغ", "مِمْحَاة", "مِسْطَرَة"], answer: 0 },
  { q: "Alat tulis berisi grafit yang dipakai untuk menulis dan menggambar disebut. Apa arti gambar tersebut dalam bahasa arab?", word: "قَلَم رَصَاص", icon: ICONS.pensil, options: ["قَلَم حِبْر", "قَلَم رَصَاص", "قَلَم تَحْدِيد", "طَبَاشِير"], answer: 1 },
  { q: "Di depan kelas, guru biasanya menulis materi pelajaran di. Apa arti gambar tersebut dalam bahasa arab?", word: "سَبُّورَة", icon: ICONS.papanTulis, options: ["سَبُّورَة", "بَاب", "نَافِذَة", "طَاوِلَة"], answer: 0 },
  { q: "Pensil yang sudah tumpul bisa dibuat runcing lagi dengan. Apa arti gambar tersebut dalam bahasa arab?", word: "مِبْرَاة", icon: ICONS.rautan, options: ["مِبْرَاة", "وَرَقَة", "حَقِيبَة", "مِسْطَرَة"], answer: 0 },
];

const LETTERS = ["A", "B", "C", "D"];
const state = { index: 0, picks: Array(QUESTIONS.length).fill(null) };

const el = {
  qno: document.getElementById("qno"),
  qimg: document.getElementById("qimg"),
  qtext: document.getElementById("qtext"),
  opts: document.getElementById("opts"),
  feedback: document.getElementById("feedback"),
  prev: document.getElementById("prev"),
  next: document.getElementById("next"),
  bar: document.getElementById("bar"),
  quiz: document.getElementById("quiz"),
  result: document.getElementById("result"),
  score: document.getElementById("score"),
  summary: document.getElementById("summary"),
  restart: document.getElementById("restart"),
};

function render() {
  const item = QUESTIONS[state.index];
  const pick = state.picks[state.index];
  const answered = pick !== null;

  el.qno.textContent = `Soal ${state.index + 1} dari ${QUESTIONS.length}`;
  el.qimg.innerHTML = item.icon;
  el.qtext.innerHTML = item.q.replace(item.word, `<span class="word">${item.word}</span>`);
  el.bar.style.width = `${(state.index / QUESTIONS.length) * 100}%`;

  el.opts.innerHTML = "";
  item.options.forEach((text, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt";
    btn.disabled = answered;
    if (answered) {
      if (i === item.answer) btn.classList.add("correct");
      else if (i === pick) btn.classList.add("wrong");
    }
    btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span class="opt-text"></span>`;
    btn.querySelector(".opt-text").textContent = text;
    btn.addEventListener("click", () => choose(i));
    el.opts.appendChild(btn);
  });

  if (answered) {
    const ok = pick === item.answer;
    el.feedback.textContent = ok
      ? "Benar."
      : `Kurang tepat. Jawaban yang benar: ${item.options[item.answer]}.`;
    el.feedback.className = `feedback ${ok ? "good" : "bad"}`;
  } else {
    el.feedback.textContent = "";
    el.feedback.className = "feedback";
  }

  el.prev.disabled = state.index === 0;
  el.next.disabled = !answered;
  el.next.textContent = state.index === QUESTIONS.length - 1 ? "Lihat hasil" : "Berikutnya";
}

function choose(i) {
  if (state.picks[state.index] !== null) return;
  state.picks[state.index] = i;
  render();
}

function showResult() {
  const correct = state.picks.reduce(
    (n, p, i) => n + (p === QUESTIONS[i].answer ? 1 : 0), 0
  );
  el.quiz.hidden = true;
  el.result.hidden = false;
  el.bar.style.width = "100%";
  el.score.textContent = `${correct} / ${QUESTIONS.length}`;
  el.summary.textContent = correct === QUESTIONS.length
    ? "Semua jawaban benar. Mantap."
    : `Kamu menjawab ${correct} soal dengan benar.`;
}

el.prev.addEventListener("click", () => {
  if (state.index > 0) { state.index--; render(); }
});
el.next.addEventListener("click", () => {
  if (state.index < QUESTIONS.length - 1) { state.index++; render(); }
  else showResult();
});
el.restart.addEventListener("click", () => {
  state.index = 0;
  state.picks = Array(QUESTIONS.length).fill(null);
  el.quiz.hidden = false;
  el.result.hidden = true;
  render();
});

render();
</script>
</html>
